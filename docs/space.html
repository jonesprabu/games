<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Star Dodger</title>
<style>
  body {
    margin: 0;
    background: #05050f;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #eee;
    font-family: system-ui, sans-serif;
  }
  h1 { margin: 12px 0 6px; letter-spacing: 1px; }
  a.back { color: #8ad; text-decoration: none; font-size: 13px; }
  a.back:hover { text-decoration: underline; }
  canvas {
    background: #000;
    border: 2px solid #222;
    border-radius: 8px;
    box-shadow: 0 0 30px rgba(120,120,255,0.25);
  }
  .info { margin-top: 10px; font-size: 14px; opacity: 0.85; text-align: center; }
</style>
</head>
<body>
  <h1>Star Dodger</h1>
  <a class="back" href="index.html">&larr; back to menu</a>
  <canvas id="game" width="800" height="560"></canvas>
  <div class="info">
    Move: &larr; &rarr; or A/D &nbsp;&middot;&nbsp; Shoot: Space &nbsp;&middot;&nbsp; P: pause &nbsp;&middot;&nbsp; R: restart
  </div>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const keys = {};
  let justPressed = {};
  addEventListener('keydown', e => {
    if (!keys[e.code]) justPressed[e.code] = true;
    keys[e.code] = true;
    if (['Space','ArrowUp','ArrowLeft','ArrowRight','ArrowDown'].includes(e.code)) e.preventDefault();
  });
  addEventListener('keyup', e => { keys[e.code] = false; });

  // Starfield
  const stars = Array.from({length: 90}, () => ({
    x: Math.random() * W,
    y: Math.random() * H,
    s: Math.random() * 1.6 + 0.4,
    v: Math.random() * 1.5 + 0.3,
  }));

  // Game state
  let ship, bullets, rocks, particles, score, lives, gameOver, paused, spawnTimer, difficulty, hiScore;
  hiScore = +localStorage.getItem('starDodgerHi') || 0;

  function reset() {
    ship = { x: W/2, y: H - 60, w: 32, h: 36, cool: 0, inv: 0 };
    bullets = [];
    rocks = [];
    particles = [];
    score = 0;
    lives = 3;
    gameOver = false;
    paused = false;
    spawnTimer = 0;
    difficulty = 0;
  }
  reset();

  function rand(a, b) { return a + Math.random() * (b - a); }
  function dist2(ax, ay, bx, by) { const dx = ax - bx, dy = ay - by; return dx*dx + dy*dy; }

  function spawnRock() {
    const r = rand(14, 34);
    const x = rand(r, W - r);
    const speed = rand(1.5, 3.2) + difficulty * 0.5;
    const vx = rand(-0.6, 0.6);
    rocks.push({
      x, y: -r, r,
      vx, vy: speed,
      rot: Math.random() * Math.PI * 2,
      rotV: rand(-0.04, 0.04),
      hp: r > 26 ? 2 : 1,
      shape: Array.from({length: 9}, (_, i) => ({
        a: (i / 9) * Math.PI * 2,
        d: rand(0.75, 1.05),
      })),
    });
  }

  function burst(x, y, color, n=14) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = rand(1, 4);
      particles.push({
        x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
        life: 30 + Math.random() * 20, age: 0, color,
      });
    }
  }

  function update() {
    if (justPressed['KeyR']) { reset(); justPressed = {}; return; }
    if (justPressed['KeyP'] && !gameOver) paused = !paused;
    if (paused || gameOver) { justPressed = {}; return; }

    // Stars scroll
    for (const s of stars) {
      s.y += s.v;
      if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
    }

    // Ship
    const left = keys['ArrowLeft'] || keys['KeyA'];
    const right = keys['ArrowRight'] || keys['KeyD'];
    const up = keys['ArrowUp'] || keys['KeyW'];
    const down = keys['ArrowDown'] || keys['KeyS'];
    const SP = 5;
    if (left)  ship.x -= SP;
    if (right) ship.x += SP;
    if (up)    ship.y -= SP;
    if (down)  ship.y += SP;
    ship.x = Math.max(ship.w/2, Math.min(W - ship.w/2, ship.x));
    ship.y = Math.max(H/2, Math.min(H - ship.h/2, ship.y));

    ship.cool--;
    ship.inv--;
    if ((keys['Space']) && ship.cool <= 0) {
      bullets.push({ x: ship.x - 6, y: ship.y - 14, vy: -9 });
      bullets.push({ x: ship.x + 6, y: ship.y - 14, vy: -9 });
      ship.cool = 9;
    }

    // Bullets
    for (const b of bullets) b.y += b.vy;
    for (let i = bullets.length - 1; i >= 0; i--) if (bullets[i].y < -10) bullets.splice(i, 1);

    // Spawn rocks
    spawnTimer--;
    difficulty = score / 500;
    const interval = Math.max(18, 55 - difficulty * 6);
    if (spawnTimer <= 0) {
      spawnRock();
      spawnTimer = interval + rand(-6, 10);
    }

    // Rocks
    for (const r of rocks) {
      r.x += r.vx; r.y += r.vy; r.rot += r.rotV;
      if (r.x < r.r) r.vx = Math.abs(r.vx);
      if (r.x > W - r.r) r.vx = -Math.abs(r.vx);
    }

    // Bullet-rock collisions
    for (let i = rocks.length - 1; i >= 0; i--) {
      const r = rocks[i];
      for (let j = bullets.length - 1; j >= 0; j--) {
        const b = bullets[j];
        if (dist2(r.x, r.y, b.x, b.y) < r.r * r.r) {
          bullets.splice(j, 1);
          r.hp--;
          burst(b.x, b.y, '#ffcf66', 6);
          if (r.hp <= 0) {
            burst(r.x, r.y, '#ff6644', 18);
            rocks.splice(i, 1);
            score += Math.floor(40 + r.r * 2);
          }
          break;
        }
      }
    }

    // Rock-ship collisions
    for (let i = rocks.length - 1; i >= 0; i--) {
      const r = rocks[i];
      if (r.y - r.r > H + 20) { rocks.splice(i, 1); continue; }
      const hitR = r.r + 14;
      if (ship.inv <= 0 && dist2(r.x, r.y, ship.x, ship.y) < hitR * hitR) {
        rocks.splice(i, 1);
        burst(r.x, r.y, '#ff6644', 20);
        burst(ship.x, ship.y, '#66ccff', 16);
        lives--;
        ship.inv = 90;
        if (lives <= 0) {
          gameOver = true;
          if (score > hiScore) {
            hiScore = score;
            localStorage.setItem('starDodgerHi', String(hiScore));
          }
        }
      }
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vx *= 0.96; p.vy *= 0.96; p.age++;
      if (p.age >= p.life) particles.splice(i, 1);
    }

    justPressed = {};
  }

  function drawStars() {
    for (const s of stars) {
      ctx.fillStyle = `rgba(255,255,255,${0.4 + s.s * 0.3})`;
      ctx.fillRect(s.x, s.y, s.s, s.s);
    }
  }

  function drawShip() {
    if (ship.inv > 0 && Math.floor(ship.inv / 5) % 2 === 0) return;
    ctx.save();
    ctx.translate(ship.x, ship.y);
    // engine flame
    ctx.fillStyle = '#ffaa44';
    ctx.beginPath();
    ctx.moveTo(-6, 14); ctx.lineTo(0, 22 + Math.random()*3); ctx.lineTo(6, 14);
    ctx.closePath(); ctx.fill();
    // body
    ctx.fillStyle = '#66ccff';
    ctx.beginPath();
    ctx.moveTo(0, -18);
    ctx.lineTo(14, 14);
    ctx.lineTo(0, 8);
    ctx.lineTo(-14, 14);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#0a3a5a';
    ctx.lineWidth = 2;
    ctx.stroke();
    // cockpit
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(0, -4, 4, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  function drawRock(r) {
    ctx.save();
    ctx.translate(r.x, r.y);
    ctx.rotate(r.rot);
    ctx.fillStyle = r.hp > 1 ? '#8a6a4a' : '#7a5a3a';
    ctx.strokeStyle = '#3a2a1a';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < r.shape.length; i++) {
      const s = r.shape[i];
      const x = Math.cos(s.a) * r.r * s.d;
      const y = Math.sin(s.a) * r.r * s.d;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  function drawBullet(b) {
    ctx.fillStyle = '#ffd24a';
    ctx.fillRect(b.x - 2, b.y - 8, 4, 10);
    ctx.fillStyle = '#fff7c0';
    ctx.fillRect(b.x - 1, b.y - 6, 2, 6);
  }

  function drawParticle(p) {
    const a = 1 - p.age / p.life;
    ctx.fillStyle = p.color;
    ctx.globalAlpha = a;
    ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3);
    ctx.globalAlpha = 1;
  }

  function drawHUD() {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px system-ui, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(`Score: ${score}`, 12, 24);
    ctx.textAlign = 'right';
    ctx.fillText(`Hi: ${Math.max(hiScore, score)}`, W - 12, 24);
    // Lives as small ships
    ctx.textAlign = 'left';
    for (let i = 0; i < lives; i++) {
      const x = 14 + i * 22, y = 44;
      ctx.fillStyle = '#66ccff';
      ctx.beginPath();
      ctx.moveTo(x, y - 8); ctx.lineTo(x + 7, y + 6); ctx.lineTo(x - 7, y + 6);
      ctx.closePath(); ctx.fill();
    }
  }

  function draw() {
    ctx.fillStyle = '#05050f';
    ctx.fillRect(0, 0, W, H);
    drawStars();
    for (const r of rocks) drawRock(r);
    for (const b of bullets) drawBullet(b);
    for (const p of particles) drawParticle(p);
    drawShip();
    drawHUD();

    if (paused) {
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 40px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Paused', W/2, H/2);
      ctx.font = '16px system-ui, sans-serif';
      ctx.fillText('Press P to resume', W/2, H/2 + 30);
    }
    if (gameOver) {
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#ff6644';
      ctx.font = 'bold 48px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Game Over', W/2, H/2 - 20);
      ctx.fillStyle = '#fff';
      ctx.font = '20px system-ui, sans-serif';
      ctx.fillText(`Final score: ${score}`, W/2, H/2 + 14);
      ctx.fillText(`Best: ${hiScore}`, W/2, H/2 + 40);
      ctx.font = '16px system-ui, sans-serif';
      ctx.fillText('Press R to play again', W/2, H/2 + 72);
    }
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>
</body>
</html>
