<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Jump & Run — 10 Levels</title>
<style>
  body {
    margin: 0;
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: system-ui, sans-serif;
    color: #eee;
  }
  h1 { margin: 12px 0 6px; }
  canvas {
    background: linear-gradient(#87ceeb, #c2e9fb);
    border: 2px solid #333;
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .info { margin-top: 10px; font-size: 14px; opacity: 0.85; text-align: center; }
  .info b { color: #f5c518; }
</style>
</head>
<body>
  <h1>Jump &amp; Run — 10 Levels</h1>
  <canvas id="game" width="900" height="500"></canvas>
  <div class="info">
    Move: &larr; &rarr; or A/D &nbsp;&middot;&nbsp; Jump: Space / W / &uarr; &nbsp;&middot;&nbsp;
    Reach the <b>flag</b> to advance &nbsp;&middot;&nbsp; R: restart level &nbsp;&middot;&nbsp; N/P: next/prev level
  </div>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const GRAVITY = 0.7;
  const MOVE_SPEED = 5;
  const JUMP_POWER = 13.5;
  const MAX_FALL = 18;

  const keys = {};
  let justPressed = {};
  addEventListener('keydown', e => {
    if (!keys[e.code]) justPressed[e.code] = true;
    keys[e.code] = true;
    if (['Space','ArrowUp','ArrowLeft','ArrowRight','ArrowDown'].includes(e.code)) e.preventDefault();
  });
  addEventListener('keyup', e => { keys[e.code] = false; });

  // Helpers
  const P = (x, y, w, h) => ({ x, y, w, h });
  const C = (x, y) => ({ x, y, r: 8 });
  const S = (x, y, w=20, h=14) => ({ x, y, w, h }); // spike
  const M = (x, y, w, h, x2, y2, speed=1.5) => ({ x, y, w, h, x1: x, y1: y, x2, y2, t: 0, speed }); // moving platform
  const F = (x, y) => ({ x, y }); // flag (goal)

  // 10 LEVELS — difficulty ramps up. Some are hard.
  const LEVELS = [
    // 1: tutorial
    {
      name: "1 · First Steps",
      spawn: { x: 60, y: 380 },
      flag: F(820, 420),
      platforms: [ P(0, 460, W, 40), P(220, 380, 120, 14), P(420, 320, 140, 14), P(620, 380, 140, 14) ],
      coins:   [ C(280, 350), C(490, 290), C(690, 350) ],
      spikes:  [],
      movers:  [],
    },
    // 2: small gaps
    {
      name: "2 · Mind the Gap",
      spawn: { x: 50, y: 380 },
      flag: F(850, 420),
      platforms: [
        P(0, 460, 220, 40), P(280, 460, 200, 40), P(540, 460, 160, 40), P(760, 460, 140, 40),
        P(200, 360, 110, 14), P(470, 320, 110, 14), P(700, 360, 110, 14),
      ],
      coins:  [ C(255, 330), C(525, 290), C(755, 330), C(340, 430) ],
      spikes: [],
      movers: [],
    },
    // 3: stair climb
    {
      name: "3 · Stairway",
      spawn: { x: 40, y: 380 },
      flag: F(850, 120),
      platforms: [
        P(0, 460, W, 40),
        P(120, 400, 110, 14), P(260, 350, 110, 14), P(400, 300, 110, 14),
        P(540, 250, 110, 14), P(680, 200, 110, 14), P(800, 160, 100, 14),
      ],
      coins:  [ C(175, 370), C(315, 320), C(455, 270), C(595, 220), C(735, 170) ],
      spikes: [],
      movers: [],
    },
    // 4: introduce spikes
    {
      name: "4 · Ouch!",
      spawn: { x: 40, y: 380 },
      flag: F(860, 420),
      platforms: [
        P(0, 460, 250, 40), P(330, 460, 180, 40), P(590, 460, 140, 40), P(790, 460, 110, 40),
        P(180, 360, 90, 14), P(420, 320, 90, 14), P(660, 360, 90, 14),
      ],
      coins:  [ C(215, 330), C(465, 290), C(700, 330) ],
      spikes: [ S(260, 446), S(280, 446), S(515, 446), S(535, 446), S(555, 446), S(735, 446), S(755, 446) ],
      movers: [],
    },
    // 5: pits — careful
    {
      name: "5 · Pit Hop",
      spawn: { x: 30, y: 380 },
      flag: F(860, 100),
      platforms: [
        P(0, 460, 140, 40),
        P(220, 420, 80, 14), P(350, 380, 80, 14), P(480, 340, 80, 14),
        P(610, 300, 80, 14), P(740, 260, 80, 14),
        P(620, 180, 80, 14), P(470, 150, 80, 14), P(800, 130, 100, 14),
      ],
      coins:  [ C(260, 390), C(390, 350), C(520, 310), C(650, 270), C(780, 230), C(510, 120) ],
      spikes: [],
      movers: [],
    },
    // 6: moving platform intro
    {
      name: "6 · On the Move",
      spawn: { x: 30, y: 380 },
      flag: F(860, 200),
      platforms: [
        P(0, 460, 180, 40), P(720, 460, 180, 40),
        P(720, 260, 180, 14),
      ],
      coins:  [ C(380, 280), C(520, 280), C(780, 230) ],
      spikes: [ S(180, 446), S(200, 446), S(220, 446), S(240, 446), S(260, 446),
                S(680, 446), S(700, 446) ],
      movers: [ M(200, 380, 100, 14, 600, 380, 1.6) ],
    },
    // 7: HARD — vertical with movers + spikes
    {
      name: "7 · Climb (Hard)",
      spawn: { x: 30, y: 420 },
      flag: F(60, 70),
      platforms: [
        P(0, 460, 200, 40),
        P(280, 410, 70, 12), P(420, 360, 70, 12), P(560, 310, 70, 12),
        P(700, 250, 70, 12), P(820, 190, 80, 12),
        P(0, 100, 220, 14),
      ],
      coins:  [ C(315, 380), C(455, 330), C(595, 280), C(735, 220), C(860, 160), C(60, 70) ],
      spikes: [ S(200, 446), S(220, 446), S(240, 446), S(260, 446) ],
      movers: [ M(560, 130, 90, 12, 320, 130, 2.0), M(330, 220, 80, 12, 720, 120, 1.8) ],
    },
    // 8: HARD — spike maze
    {
      name: "8 · Spike Run (Hard)",
      spawn: { x: 30, y: 380 },
      flag: F(860, 420),
      platforms: [
        P(0, 460, W, 40),
        P(150, 370, 60, 12), P(260, 330, 60, 12), P(370, 290, 60, 12),
        P(480, 290, 60, 12), P(590, 330, 60, 12), P(700, 370, 60, 12),
      ],
      coins:  [ C(180, 340), C(290, 300), C(400, 260), C(510, 260), C(620, 300), C(730, 340) ],
      spikes: [
        S(120, 446), S(140, 446), S(220, 446), S(240, 446), S(260, 446),
        S(330, 446), S(350, 446), S(370, 446), S(440, 446), S(460, 446), S(480, 446),
        S(560, 446), S(580, 446), S(660, 446), S(680, 446), S(760, 446), S(780, 446), S(800, 446),
      ],
      movers: [],
    },
    // 9: HARD — long mover gauntlet
    {
      name: "9 · Gauntlet (Hard)",
      spawn: { x: 30, y: 380 },
      flag: F(860, 120),
      platforms: [
        P(0, 460, 140, 40),
        P(820, 460, 80, 40),
        P(820, 160, 80, 14),
      ],
      coins:  [ C(250, 320), C(450, 250), C(650, 200), C(860, 120) ],
      spikes: [ S(140, 446), S(160, 446), S(180, 446), S(200, 446), S(220, 446),
                S(240, 446), S(260, 446), S(280, 446), S(300, 446), S(320, 446),
                S(340, 446), S(360, 446), S(380, 446), S(400, 446), S(420, 446),
                S(440, 446), S(460, 446), S(480, 446), S(500, 446), S(520, 446),
                S(540, 446), S(560, 446), S(580, 446), S(600, 446), S(620, 446),
                S(640, 446), S(660, 446), S(680, 446), S(700, 446), S(720, 446),
                S(740, 446), S(760, 446), S(780, 446), S(800, 446) ],
      movers: [
        M(170, 380, 80, 12, 170, 380, 0),         // static stepping stone (start)
        M(160, 360, 70, 12, 380, 280, 1.8),
        M(380, 230, 70, 12, 620, 180, 1.8),
        M(620, 150, 70, 12, 800, 160, 1.6),
      ],
    },
    // 10: FINAL — everything at once
    {
      name: "10 · The Final Leap (Hard)",
      spawn: { x: 30, y: 400 },
      flag: F(50, 70),
      platforms: [
        P(0, 460, 120, 40),
        P(170, 420, 60, 12), P(280, 380, 60, 12),
        P(720, 460, 60, 40), P(820, 460, 80, 40),
        P(820, 360, 80, 12), P(820, 260, 80, 12), P(820, 170, 80, 12),
        P(0, 100, 160, 14),
      ],
      coins:  [ C(200, 390), C(310, 350), C(860, 330), C(860, 230), C(860, 140), C(50, 70) ],
      spikes: [
        S(120, 446), S(140, 446), S(230, 446), S(250, 446), S(340, 446), S(360, 446),
        S(380, 446), S(400, 446), S(420, 446), S(440, 446), S(460, 446), S(480, 446),
        S(500, 446), S(520, 446), S(540, 446), S(560, 446), S(580, 446), S(600, 446),
        S(620, 446), S(640, 446), S(660, 446), S(680, 446), S(700, 446),
        S(160, 86), S(180, 86),
      ],
      movers: [
        M(360, 320, 70, 12, 640, 320, 2.2),
        M(420, 230, 70, 12, 220, 200, 2.0),
        M(220, 150, 70, 12, 420, 150, 2.4),
      ],
    },
  ];

  // ----- State -----
  let levelIdx = 0;
  let coinsCollected = 0;
  let totalCoins = 0;
  let levelComplete = false;
  let completeTimer = 0;
  let allDone = false;
  let attempts = 0;

  const player = {
    x: 0, y: 0, w: 26, h: 38,
    vx: 0, vy: 0,
    onGround: false,
    facing: 1,
  };

  function loadLevel(i) {
    levelIdx = ((i % LEVELS.length) + LEVELS.length) % LEVELS.length;
    const lv = LEVELS[levelIdx];
    player.x = lv.spawn.x;
    player.y = lv.spawn.y;
    player.vx = 0; player.vy = 0;
    player.onGround = false;
    for (const c of lv.coins) c.taken = false;
    for (const m of lv.movers) { m.t = 0; m.x = m.x1; m.y = m.y1; }
    levelComplete = false;
    completeTimer = 0;
    coinsCollected = 0;
    totalCoins = lv.coins.length;
    attempts = 0;
  }

  function respawn() {
    const lv = LEVELS[levelIdx];
    player.x = lv.spawn.x;
    player.y = lv.spawn.y;
    player.vx = 0; player.vy = 0;
    player.onGround = false;
    attempts++;
  }

  function rectOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function spikeHit(p, s) {
    // approximate the spike as a triangle with base s.w, point up. Use bounding rect minus top corners.
    const r = { x: s.x, y: s.y, w: s.w, h: s.h };
    return rectOverlap(p, r);
  }

  function updateMovers(lv) {
    for (const m of lv.movers) {
      if (m.speed === 0) continue;
      m.t += 0.016 * m.speed;
      const phase = (Math.sin(m.t) + 1) / 2; // 0..1
      const nx = m.x1 + (m.x2 - m.x1) * phase;
      const ny = m.y1 + (m.y2 - m.y1) * phase;
      m.dx = nx - m.x;
      m.dy = ny - m.y;
      m.x = nx; m.y = ny;
    }
  }

  function update() {
    const lv = LEVELS[levelIdx];

    if (justPressed['KeyR']) respawn();
    if (justPressed['KeyN']) { loadLevel(levelIdx + 1); justPressed = {}; return; }
    if (justPressed['KeyP']) { loadLevel(levelIdx - 1); justPressed = {}; return; }

    if (levelComplete) {
      completeTimer++;
      if (completeTimer > 70) {
        if (levelIdx === LEVELS.length - 1) {
          allDone = true;
        } else {
          loadLevel(levelIdx + 1);
        }
      }
      justPressed = {};
      return;
    }

    if (allDone) {
      if (justPressed['Space'] || justPressed['Enter']) {
        allDone = false;
        loadLevel(0);
      }
      justPressed = {};
      return;
    }

    updateMovers(lv);

    const left = keys['ArrowLeft'] || keys['KeyA'];
    const right = keys['ArrowRight'] || keys['KeyD'];
    const jump = keys['Space'] || keys['ArrowUp'] || keys['KeyW'];

    player.vx = 0;
    if (left)  { player.vx = -MOVE_SPEED; player.facing = -1; }
    if (right) { player.vx =  MOVE_SPEED; player.facing =  1; }

    if (jump && player.onGround) {
      player.vy = -JUMP_POWER;
      player.onGround = false;
    }

    player.vy += GRAVITY;
    if (player.vy > MAX_FALL) player.vy = MAX_FALL;

    // Horizontal
    player.x += player.vx;
    if (player.x < 0) player.x = 0;
    if (player.x + player.w > W) player.x = W - player.w;

    // Vertical + platform collisions (static + moving)
    player.y += player.vy;
    player.onGround = false;
    const allPlatforms = lv.platforms.concat(lv.movers);
    for (const p of allPlatforms) {
      const inX = player.x + player.w > p.x && player.x < p.x + p.w;
      if (!inX) continue;
      const prevBottom = player.y + player.h - player.vy;
      if (player.vy >= 0 && prevBottom <= p.y + 1 && player.y + player.h >= p.y) {
        player.y = p.y - player.h;
        player.vy = 0;
        player.onGround = true;
        if (p.dx) player.x += p.dx; // ride moving platform
      }
    }

    // Fall off the world
    if (player.y > H + 60) { respawn(); return; }

    // Spikes
    for (const s of lv.spikes) {
      if (spikeHit(player, s)) { respawn(); return; }
    }

    // Coins
    for (const c of lv.coins) {
      if (c.taken) continue;
      const cb = { x: c.x - c.r, y: c.y - c.r, w: c.r*2, h: c.r*2 };
      if (rectOverlap(player, cb)) { c.taken = true; coinsCollected++; }
    }

    // Flag
    const fbox = { x: lv.flag.x - 10, y: lv.flag.y - 40, w: 24, h: 40 };
    if (rectOverlap(player, fbox)) {
      levelComplete = true;
      completeTimer = 0;
    }

    justPressed = {};
  }

  // ----- Drawing -----
  function drawClouds() {
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    const offsets = [60, 220, 380, 540, 700, 860];
    for (let i = 0; i < offsets.length; i++) {
      const cx = offsets[i];
      const cy = 50 + (i % 2) * 28;
      ctx.beginPath();
      ctx.arc(cx, cy, 16, 0, Math.PI*2);
      ctx.arc(cx + 16, cy + 4, 20, 0, Math.PI*2);
      ctx.arc(cx + 36, cy, 14, 0, Math.PI*2);
      ctx.fill();
    }
  }

  function drawPlatform(p, isMover) {
    if (p.y === 460 && p.h === 40) {
      ctx.fillStyle = '#5a3a22';
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.fillStyle = '#3a8a3a';
      ctx.fillRect(p.x, p.y, p.w, 8);
    } else {
      ctx.fillStyle = isMover ? '#b07842' : '#8b5a2b';
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.fillStyle = isMover ? '#f0c060' : '#3a8a3a';
      ctx.fillRect(p.x, p.y, p.w, 4);
    }
  }

  function drawSpike(s) {
    ctx.fillStyle = '#666';
    ctx.beginPath();
    ctx.moveTo(s.x, s.y + s.h);
    ctx.lineTo(s.x + s.w/2, s.y);
    ctx.lineTo(s.x + s.w, s.y + s.h);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  function drawCoin(c, t) {
    const wob = Math.sin(t/8 + c.x) * 2;
    ctx.fillStyle = '#f5c518';
    ctx.beginPath();
    ctx.arc(c.x, c.y + wob, c.r, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#c79500';
    ctx.fillRect(c.x - 1, c.y + wob - 5, 2, 10);
  }

  function drawFlag(f) {
    ctx.fillStyle = '#444';
    ctx.fillRect(f.x, f.y - 40, 3, 40);
    ctx.fillStyle = '#e94560';
    ctx.beginPath();
    ctx.moveTo(f.x + 3, f.y - 38);
    ctx.lineTo(f.x + 24, f.y - 30);
    ctx.lineTo(f.x + 3, f.y - 22);
    ctx.closePath();
    ctx.fill();
  }

  function drawPlayer() {
    ctx.fillStyle = '#e94560';
    ctx.fillRect(player.x, player.y, player.w, player.h);
    ctx.fillStyle = '#fff';
    const eyeX = player.x + (player.facing > 0 ? 16 : 4);
    ctx.fillRect(eyeX, player.y + 9, 6, 6);
    ctx.fillStyle = '#000';
    ctx.fillRect(eyeX + (player.facing > 0 ? 3 : 0), player.y + 11, 3, 3);
  }

  let frame = 0;
  function draw() {
    frame++;
    ctx.clearRect(0, 0, W, H);
    drawClouds();

    const lv = LEVELS[levelIdx];
    for (const p of lv.platforms) drawPlatform(p, false);
    for (const m of lv.movers) drawPlatform(m, true);
    for (const s of lv.spikes) drawSpike(s);
    for (const c of lv.coins) if (!c.taken) drawCoin(c, frame);
    drawFlag(lv.flag);
    drawPlayer();

    // HUD
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0, 0, W, 30);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px system-ui, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(`Level ${levelIdx+1}/${LEVELS.length} — ${lv.name}`, 10, 20);
    ctx.textAlign = 'right';
    ctx.fillText(`Coins ${coinsCollected}/${totalCoins}   Tries ${attempts}`, W - 10, 20);
    ctx.textAlign = 'left';

    if (levelComplete) {
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(0, H/2 - 40, W, 80);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 30px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(`Level ${levelIdx+1} clear!`, W/2, H/2 + 8);
      ctx.textAlign = 'left';
    }

    if (allDone) {
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#f5c518';
      ctx.font = 'bold 44px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('You beat all 10 levels!', W/2, H/2 - 10);
      ctx.fillStyle = '#fff';
      ctx.font = '18px system-ui, sans-serif';
      ctx.fillText('Press Space or Enter to play again', W/2, H/2 + 28);
      ctx.textAlign = 'left';
    }
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  loadLevel(0);
  loop();
})();
</script>
</body>
</html>
